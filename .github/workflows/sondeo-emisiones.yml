name: sondeo-emisiones
on:
  push:
    branches: [claude/project-thread-1iz5vj]
    paths: [.github/workflows/sondeo-emisiones.yml]
permissions:
  contents: write
jobs:
  sondeo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Sondeo Climate TRACE
        run: |
          mkdir -p /tmp/pub/s && cd /tmp/pub/s
          B=https://api.climatetrace.org
          p(){ n=$1; u=$2; curl -s -m 120 -H "Origin: https://controlvegetal.github.io" -D $n.h -o $n.b "$u"; echo "$n $(head -1 $n.h) $(wc -c < $n.b)" >> resumen.txt; }
          p cement "$B/v6/assets?countries=ARG&subsectors=cement&limit=100"
          p cement24 "$B/v6/assets?countries=ARG&subsectors=cement&year=2024&limit=100"
          p power "$B/v6/assets?countries=ARG&sectors=power&limit=500"
          p elec "$B/v6/assets?countries=ARG&subsectors=electricity-generation&limit=500"
          p feed "$B/v6/assets?countries=ARG&subsectors=enteric-fermentation-cattle-operation&limit=500"
          p asset1 "$B/v6/assets/60951941"
          p sources "$B/v6/sources?countries=ARG&limit=2"
          curl -s -m 300 -o dl.zip "https://downloads.climatetrace.org/latest/country_packages/co2e_100yr/ARG.zip"
          unzip -l dl.zip > zip_listado.txt
          mkdir z && cd z && unzip -q ../dl.zip && cd ..
          find z -name "*.csv" | while read f; do echo "== $f $(wc -l < "$f")"; head -3 "$f" | cut -c1-1500; done > zip_cabeceras.txt
          find z -iname "*readme*" -o -iname "*.txt" -o -iname "*.md" | head -5 | while read f; do echo "== $f"; head -c 4000 "$f"; done > zip_leeme.txt
          rm -rf z dl.zip
          sed -i -E 's/[ps]k\.[A-Za-z0-9._-]{20,}/TOKEN_QUITADO/g; s/access_token=[^"&]*/access_token=QUITADO/g' *.b *.txt
          cat resumen.txt
      - name: Guardar
        run: |
          cd /tmp/pub
          git init -q -b sondeo-emisiones
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm sondeo
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" sondeo-emisiones
