name: sondeo-de
on:
  push:
    branches: [claude/project-thread-53hudt]
    paths: [.github/workflows/sondeo-de.yml]
jobs:
  sondeo:
    runs-on: ubuntu-latest
    steps:
      - run: |
          cat > /tmp/s.py <<'PY'
          import json, urllib.request, datetime as dt
          def get(u):
              try:
                  with urllib.request.urlopen(urllib.request.Request(u, headers={'User-Agent': 'monitor-energia'}), timeout=30) as r: return json.load(r)
              except Exception as e: return {'error': str(e)}
          iso = lambda ms: dt.datetime.fromtimestamp(ms/1000, dt.UTC).strftime('%Y-%m-%d %H:%MZ')
          def last(f, r, res='quarterhour'):
              ix = get(f'https://www.smard.de/app/chart_data/{f}/{r}/index_{res}.json')
              if 'timestamps' not in ix: return f'ERR {ix}'
              out = []
              for ts in ix['timestamps'][-2:]:
                  d = get(f'https://www.smard.de/app/chart_data/{f}/{r}/{f}_{r}_{res}_{ts}.json')
                  s = d.get('series', [])
                  v = [x for x in s if x[1] is not None]
                  out.append(f'chunk {iso(ts)} n={len(s)} nn={len(v)} last={iso(v[-1][0]) if v else None} val={v[-1][1] if v else None}')
              return ' | '.join(out)
          for r in ['DE', 'DE-LU', '50Hertz', 'Amprion', 'TenneT', 'TransnetBW']:
              for f in [410, 4068, 4067, 4071]:
                  print(r, f, last(f, r))
          print('price qh', last(4169, 'DE-LU'))
          print('price h', last(4169, 'DE-LU', 'hour'))
          print('load fc', last(411, 'DE'))
          for u in ['https://api.energy-charts.info/public_power?country=de', 'https://api.energy-charts.info/cbpf?country=de', 'https://api.energy-charts.info/price?bzn=DE-LU', 'https://api.energy-charts.info/cbet?country=de']:
              d = get(u); t = d.get('unix_seconds', [])
              print(u, d.get('error'), 'n', len(t), iso(t[0]*1000) if t else '', iso(t[-1]*1000) if t else '', d.get('license_info'), d.get('deprecated'))
              for k in ('production_types', 'countries'):
                  for p in d.get(k, []):
                      v = [(t[i], x) for i, x in enumerate(p['data']) if x is not None]
                      print('   ', p['name'], 'nn', len(v), iso(v[-1][0]*1000) if v else None, v[-1][1] if v else None)
              if 'price' in d:
                  v=[(t[i],x) for i,x in enumerate(d['price']) if x is not None]; print('   price nn', len(v), iso(v[-1][0]*1000), v[-1][1], d.get('unit'))
          PY
          python3 /tmp/s.py
          curl -sI -H "Origin: https://controlvegetal.github.io" https://raw.githubusercontent.com/ControlVegetal/monitor-energia/main/README.md | grep -iE "^HTTP|access-control|cache-control"
