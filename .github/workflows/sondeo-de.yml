name: sondeo-de
on:
  push:
    branches: [claude/project-thread-53hudt]
    paths: [.github/workflows/sondeo-de.yml]
jobs:
  sondeo:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          O="Origin: https://controlvegetal.github.io"
          p() { echo; echo "=== $1"; curl -s -m 30 -D /tmp/h -o /tmp/b -H "$O" "$1"; grep -iE "^HTTP|access-control|content-type|cache-control|content-length" /tmp/h; head -c ${2:-600} /tmp/b; echo; }
          p "https://www.smard.de/app/chart_data/410/DE/index_quarterhour.json" 300
          for r in 50Hertz Amprion TenneT TransnetBW DE-LU; do p "https://www.smard.de/app/chart_data/4068/$r/index_quarterhour.json" 200; done
          TS=$(curl -s https://www.smard.de/app/chart_data/4068/50Hertz/index_quarterhour.json | python3 -c "import json,sys;print(json.load(sys.stdin)['timestamps'][-1])")
          echo "TS=$TS"
          curl -s https://www.smard.de/app/chart_data/4068/50Hertz/4068_50Hertz_quarterhour_$TS.json | python3 -c "import json,sys;d=json.load(sys.stdin)['series'];v=[x for x in d if x[1] is not None];print(len(d),len(v),v[-3:])"
          for f in 410 1223 1224 4066 1225 4067 4068 1226 1227 1228 4069 4070 4071 4359 4387; do for r in 50Hertz TransnetBW; do
            T=$(curl -s https://www.smard.de/app/chart_data/$f/$r/index_hour.json | python3 -c "import json,sys;print(json.load(sys.stdin)['timestamps'][-1])" 2>/dev/null)
            echo -n "f=$f r=$r hour "; curl -s https://www.smard.de/app/chart_data/$f/$r/${f}_${r}_hour_$T.json | python3 -c "import json,sys;d=json.load(sys.stdin)['series'];v=[x for x in d if x[1] is not None];print(len(v),v[-1] if v else None)" 2>&1 | head -c 200; echo
            T=$(curl -s https://www.smard.de/app/chart_data/$f/$r/index_quarterhour.json | python3 -c "import json,sys;print(json.load(sys.stdin)['timestamps'][-1])" 2>/dev/null)
            echo -n "f=$f r=$r qh "; curl -s https://www.smard.de/app/chart_data/$f/$r/${f}_${r}_quarterhour_$T.json | python3 -c "import json,sys;d=json.load(sys.stdin)['series'];v=[x for x in d if x[1] is not None];print(len(v),v[-1] if v else None)" 2>&1 | head -c 200; echo
          done; done
          for f in 4169 4996 4997; do T=$(curl -s https://www.smard.de/app/chart_data/$f/DE-LU/index_hour.json | python3 -c "import json,sys;print(json.load(sys.stdin)['timestamps'][-1])" 2>/dev/null); echo -n "price f=$f "; curl -s https://www.smard.de/app/chart_data/$f/DE-LU/${f}_DE-LU_hour_$T.json | python3 -c "import json,sys;d=json.load(sys.stdin)['series'];v=[x for x in d if x[1] is not None];print(len(v),v[-2:])" 2>&1|head -c 200; echo; done
          p "https://api.energy-charts.info/public_power?country=de" 400
          p "https://api.energy-charts.info/price?bzn=DE-LU" 400
          p "https://api.energy-charts.info/cbpf?country=de" 1500
          p "https://api.energy-charts.info/public_power?country=de&subregion=50Hertz" 300
          curl -s https://api.energy-charts.info/openapi.json -o /tmp/o.json && python3 -c "
          import json;o=json.load(open('/tmp/o.json'))
          for k,v in o['paths'].items():
            ps=[(p['name'],p.get('schema',{}).get('enum') or p.get('description','')[:150]) for p in v.get('get',{}).get('parameters',[])]
            print(k, ps)
          "
          p "https://api.energy-charts.info/total_power?country=de" 400
          for c in 50Hertz Amprion TenneT TransnetBW de_50hertz; do p "https://api.energy-charts.info/total_power?country=$c" 200; p "https://api.energy-charts.info/public_power?country=$c" 200; done
